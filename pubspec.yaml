name: kiolog
description: Bitácora personal de salud — plan alimenticio, ejercicio, agua y sueño.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  collection: ^1.18.0

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # DI & Navigation
  get_it: ^7.7.0
  go_router: ^13.0.0

  # Security
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Geolocation & Maps
  geolocator: ^12.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.1

  # Files & Media
  image_picker: ^1.0.7

  # PDF & Share
  pdf: ^3.10.7
  share_plus: ^12.0.2

  # Internationalization
  intl: ^0.19.0

  # Preferences
  shared_preferences: ^2.3.0

  # Fonts
  google_fonts: ^6.2.1

  # HTTP (AI providers)
  http: ^1.2.1
  thermion_flutter: ^0.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/img/kiolog_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/models/anatomy_body.glb
    - assets/models/anatomy_body.json
    - assets/models/rewards.glb

# thermion pulls image 4.11.0, which needs a newer archive than its own constraint allows.
dependency_overrides:
  archive: ^4.6.0
  image: ^4.12.0
